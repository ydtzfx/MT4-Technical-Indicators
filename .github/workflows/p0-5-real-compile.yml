          path: release/ci

      - name: Download runtime evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p0-5-runtime-${{ github.sha }}
          path: release/runtime

      - name: Programmatic release verdict
        run: |
          python Tools/ci/p05_verify.py release-gate \
            --ci release/ci \
            --runtime release/runtime \
            --out release/final

      - name: Publish release summary
        if: always()
        run: |
          if [ -f release/final/release-gate.md ]; then
            cat release/final/release-gate.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-5-release-gate-${{ github.sha }}
          path: release/final
          if-no-files-found: error
          retention-days: 30
 artifacts/p0-5/runtime-capability/image-files.txt | head -n1 || true)
          metaeditor_path=$(grep -Ei 'MetaTrader 4/metaeditor\.exe    name: P0.5 / Required Gate
