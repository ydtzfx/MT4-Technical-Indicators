name: P0.5 MT4 Runtime Verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-5-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Runtime / MT4 image preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect locked MT4 runtime image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='docker.io/mhriemers/metatrader-4@sha256:ed6c3abb2188ac178f183e30bd03cb85c7f2bf8abebfdffa70c070ff2fb1ad74'
          docker pull "$IMAGE"
          docker run --rm --entrypoint bash "$IMAGE" -lc '
            set -e
            echo "=== executables ==="
            find /root/.wine/drive_c -type f \( -iname "terminal.exe" -o -iname "metaeditor.exe" \) -print
            echo "=== MT4 directories ==="
            find "/root/.wine/drive_c/Program Files" -maxdepth 4 -type d 2>/dev/null | grep -Ei "MetaTrader|tester|history|MQL4" || true
            echo "=== history/tester assets ==="
            find /root/.wine -type f \( -iname "*.hst" -o -iname "*.fxt" -o -iname "*.srv" \) -print | head -200 || true
          '
